<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Keeps the single-file offline build safe to iframe and to open over file://.
         'unsafe-inline' script is required: vite-plugin-singlefile inlines the bundle. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self' 'unsafe-inline' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'" />
    <title>Architecture diagrams</title>
    <script>
      (() => {
        const preferred = window.matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark'
          : 'light';
        try {
          const saved = window.localStorage.getItem('dg-theme');
          document.documentElement.dataset.theme = saved === 'dark' || saved === 'light'
            ? saved
            : preferred;
        } catch {
          document.documentElement.dataset.theme = preferred;
        }
      })();
    </script>
  </head>
  <body>
    <script id="arc-state">window.__ARC_STATE__=null</script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
